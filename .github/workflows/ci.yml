
name: Phoenix Test Automation Workflow

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

  schedule:
    # Runs daily at midnight IST (18:30 UTC)
    - cron: "30 18 * * *"
    - cron: "30 17 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options:
          - qa
          - uat
          - dev
        default: qa
        required: true

      suiteXmlFile:
        description: "TestNG XML File"
        type: choice
        options:
          - testng.xml
          - smoke.xml
          - regression.xml
        default: testng.xml
        required: true

jobs:
  test:
    name: Execute API Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Execute Test Automation Framework
        run: >
          mvn clean test
          -DsuiteXmlFile="${{ inputs.suiteXmlFile || 'testng.xml' }}"
          -Denv="${{ inputs.env || 'qa' }}"

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SureFire-Report
          path: target/surefire-reports/
          retention-days: 10
          if-no-files-found: warn
